schemaVersion: 1
meta:
  project: hyosan-memories
  milestone: G2
  styleRef: "Netflix 《지금 우리 학교는》 시즌1의 배우·의상·효산고 프로덕션 디자인에 충실한 고해상도 페인티드 2D 게임 에셋"
  rightsScope: "사용자 제공 Netflix 계약 전제 · 시즌1 시각 에셋과 출연 배우 초상 재현 허용 · 음성은 별도 승인 전 제외"
  fidelityTargets:
    - season-1-production-design
    - canonical-actor-likeness
    - uniform-costume-continuity
  forbidden:
    - gore
    - webtoon-elements
    - wrong-season-elements
  referenceSources:
    - id: netflix-season-1-stills
      authority: official
      url: "https://about.netflix.com/ko/news/help-is-not-coming-all-of-us-are-dead-released-new-teaser-trailer-and-stills"
    - id: netflix-cast-guide
      authority: official
      url: "https://www.netflix.com/tudum/articles/all-of-us-are-dead-cast-characters"
    - id: netflix-season-1-featurette
      authority: official
      url: "https://www.youtube.com/watch?v=38h_mFMYc8Y"
    - id: netflix-korea-cafeteria-clip
      authority: official
      url: "https://www.youtube.com/watch?v=mh3a3Bj-IPY"
pipeline:
  maxAttempts: 3
  planner: codex-session
  generator: direct-imagegen-skill
  visionQa: codex-session-vision
  approvalBlocks: [G3]
  workDirectory: outputs/hyosan-memories-g2
  outputDirectory: docs/games/hyosan-memories-g2-assets
  atlas:
    name: hyosan-memories-g2-sprites
    padding: 4
    extrusion: 1
    maxSize: 4096
assets:
  - id: player_halfbie_walk
    label: "플레이어 — 교복 절비 4방향 이동"
    kind: sprite
    view: topdown-3q-four-direction
    size: 128x128
    frames: 24
    frameLayout: { columns: 6, rows: 4, order: row-major, anchor: bottom-center, trim: shared-scale }
    alpha: required
    identity: { mode: original }
    referenceIds: [netflix-season-1-stills, netflix-cast-guide, netflix-season-1-featurette]
    promptBrief: >-
      승인된 M0 교복 절비와 동일한 오리지널 남학생을 4방향 걷기 시트로 확장한다. 각 행은
      남쪽·서쪽·북쪽·동쪽 순서이고 행마다 자연스러운 6프레임 걷기 사이클이다. 병녹색
      V넥 니트 조끼, 흰 셔츠, 회녹색 타탄 바지, 녹색·노랑·빨강 사선 타이, 착용자 왼쪽
      가슴의 빨간 한글 이름표와 빨강·금색 원형 교표를 모든 방향에서 유지하며 좌우
      미러링하지 않는다. 한쪽 눈의 미세한 비인간적 광택만 쓰고 피·상처는 없다. 정확히
      6열×4행, 투명 배경, 셀마다 한 인물, 공통 비율과 발 피벗, 텍스트·풍경 없음.
    qa: &characterQa
      minScore: 0.8
      minSourceFidelity: 0.85
      minSourceSize: 1536x1024
      maxOpaqueEdgeRatio: 0.02
      minBboxCoverage: 0.12
      maxBboxCoverage: 0.9
  - id: player_halfbie_attack_combo
    label: "플레이어 — 교복 절비 4방향 3타 공격"
    kind: sprite
    view: topdown-3q-four-direction
    size: 128x128
    frames: 24
    frameLayout: { columns: 6, rows: 4, order: row-major, anchor: bottom-center, trim: shared-scale }
    alpha: required
    identity: { mode: original }
    referenceIds: [netflix-season-1-stills, netflix-cast-guide, netflix-season-1-featurette]
    promptBrief: >-
      승인된 M0 교복 절비와 동일한 오리지널 남학생의 맨손 3타 콤보. 각 행은
      남쪽·서쪽·북쪽·동쪽 순서이고 6개 열이 준비→1타→전환→2타→강타 준비→3타 마무리를
      이룬다. 승인된 얼굴·머리·체형과 효산고 교복 색·타탄·타이·왼쪽 이름표·교표를
      바꾸지 않고 좌우 미러링하지 않는다. 무혈 타격이며 무기·이펙트·상처는 없다.
      정확히 6열×4행, 투명 배경, 셀마다 한 인물, 공통 비율과 발 피벗, 텍스트·풍경 없음.
    qa: *characterQa
  - id: student_zombie_run
    label: "학생 좀비 — 4방향 달리기"
    kind: sprite
    view: topdown-3q-four-direction
    size: 128x128
    frames: 24
    frameLayout: { columns: 6, rows: 4, order: row-major, anchor: bottom-center, trim: shared-scale }
    alpha: required
    identity: { mode: original }
    referenceIds: [netflix-season-1-stills, netflix-season-1-featurette, netflix-korea-cafeteria-clip]
    promptBrief: >-
      승인된 M0 이름 없는 남학생 좀비와 동일한 엑스트라의 빠르고 경직된 4방향 달리기.
      각 행은 남쪽·서쪽·북쪽·동쪽 순서이고 행마다 6프레임이다. 병녹색 니트 조끼,
      흰 셔츠, 회녹색 타탄 바지, 사선 타이, 착용자 왼쪽 이름표와 교표를 유지하고
      좌우 미러링하지 않는다. 창백한 피부와 비정상적인 관절 리듬만 사용하며 피·교상·
      열린 상처는 없다. 정확히 6열×4행, 투명 배경, 공통 비율과 발 피벗, 텍스트·풍경 없음.
    qa: *characterQa
  - id: student_zombie_attack
    label: "학생 좀비 — 4방향 공격"
    kind: sprite
    view: topdown-3q-four-direction
    size: 128x128
    frames: 16
    frameLayout: { columns: 4, rows: 4, order: row-major, anchor: bottom-center, trim: shared-scale }
    alpha: required
    identity: { mode: original }
    referenceIds: [netflix-season-1-stills, netflix-season-1-featurette, netflix-korea-cafeteria-clip]
    promptBrief: >-
      승인된 M0 이름 없는 남학생 좀비와 동일한 엑스트라의 무혈 할퀴기 공격. 각 행은
      남쪽·서쪽·북쪽·동쪽 순서이고 4개 열이 웅크림→팔 뻗기→최대 도달→회수를 이룬다.
      효산고 교복과 왼쪽 이름표·교표, 얼굴·머리·체형을 유지하며 좌우 미러링하지 않는다.
      피·교상·열린 상처는 없다. 정확히 4열×4행, 투명 배경, 공통 비율과 발 피벗,
      텍스트·풍경 없음.
    qa:
      <<: *characterQa
      minSourceSize: 1024x1024
  - id: nurse_kim_kyungmi_run
    label: "보스 — 보건교사 김경미 4방향 이동"
    kind: boss
    view: topdown-3q-four-direction
    size: 192x192
    frames: 24
    frameLayout: { columns: 6, rows: 4, order: row-major, anchor: bottom-center, trim: shared-scale }
    alpha: required
    identity: &nurseIdentity
