      헝클어진 갈색 머리·체형·흰 보건교사 가운과 베이지색 상의까지 충실히 재현한 보스
      이동 시트. 각 행은 남쪽·서쪽·북쪽·동쪽 순서이고 행마다 경련 뒤 급가속하는
      6프레임이다. 감염은 창백한 피부·흐린 눈·경직된 자세로만 표현하며 피·교상·열린
      상처는 제거한다. 정확히 6열×4행, 투명 배경, 셀마다 한 인물, 공통 비율과 발 피벗,
