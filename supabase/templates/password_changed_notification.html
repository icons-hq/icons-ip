<h2>ICONS 비밀번호 변경 안내</h2>
<p>{{ .Email }} 계정의 비밀번호가 변경되었습니다.</p>
<p>본인이 변경했다면 이 메일은 무시해주세요.</p>
<p>본인이 변경하지 않았다면 아래 버튼을 눌러 바로 비밀번호를 재설정하고 고객센터로 알려주세요. 재설정을 마치면 모든 기기에서 로그아웃됩니다.</p>
<p><a href="{{ .SiteURL }}/login?mode=reset">비밀번호 재설정하기</a></p>
<p>SNS로 가입한 계정은 비밀번호를 쓰지 않습니다. SNS로 가입했는데 이 메일을 받았다면 재설정 대신 고객센터로 바로 알려주세요.</p>
