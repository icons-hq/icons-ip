name: Supabase Preview Cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  # pipeline의 branch 생성이 끝난 뒤 cleanup이 실행되도록 repo-wide key를 공유한다.
  group: supabase-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: "2.101.0"

jobs:
  delete-preview-branch:
    name: delete-preview-branch
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PREVIEW_PROJECT_ID: ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
      SUPABASE_PRODUCTION_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Check cleanup target
        run: |
          set -euo pipefail

          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PREVIEW_PROJECT_ID SUPABASE_PRODUCTION_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is required for preview cleanup"
              missing=1
            fi
          done
          if [ -n "$SUPABASE_PREVIEW_PROJECT_ID" ] \
            && [ "$SUPABASE_PREVIEW_PROJECT_ID" = "$SUPABASE_PRODUCTION_PROJECT_ID" ]; then
            echo "::error title=Preview Supabase must not be production::Refusing branch cleanup"
            missing=1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid PR number::Refusing branch cleanup"
            missing=1
          fi
          exit "$missing"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Delete isolated preview branch
        run: |
          set -euo pipefail

          branch_name="pr-${PR_NUMBER}"
          branch_json="$(
            supabase branches list \
              --project-ref "$SUPABASE_PREVIEW_PROJECT_ID" \
              --output json \
              | jq -c --arg name "$branch_name" \
                '.[] | select(.name == $name and .is_default == false)'
          )"
          if [ -z "$branch_json" ]; then
            echo "No isolated branch named $branch_name exists." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch_project_ref="$(jq -r '.project_ref // empty' <<<"$branch_json")"
          if [ -z "$branch_project_ref" ] \
            || [ "$branch_project_ref" = "$SUPABASE_PREVIEW_PROJECT_ID" ] \
            || [ "$branch_project_ref" = "$SUPABASE_PRODUCTION_PROJECT_ID" ]; then
            echo "::error title=Unsafe preview cleanup target::Refusing to delete $branch_name"
            exit 1
          fi

          supabase branches delete "$branch_name" \
            --project-ref "$SUPABASE_PREVIEW_PROJECT_ID" \
            --yes
          echo "Deleted isolated Supabase branch $branch_name ($branch_project_ref)." \
            >> "$GITHUB_STEP_SUMMARY"
