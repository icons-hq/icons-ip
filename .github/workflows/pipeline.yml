name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26"
  SUPABASE_CLI_VERSION: "2.101.0"
  VERCEL_CLI_VERSION: "54.14.2"

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase database
        run: supabase db start

      - name: Apply local migrations
        run: supabase db reset --local --no-seed

      - name: Run database smoke tests
        run: |
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/catalog_baseline.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/profile_editing.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/in_app_notifications.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_notification_console.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_role_management.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_member_suspension.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_artwork_upload_storage.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/home_curations.sql
          bash supabase/tests/home_curations_concurrency.sh
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/cart_items.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/checkout_order.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/order_history.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/payment_provider_foundation.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/order_cancellation.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/order_withdrawal_deadline.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_order_console.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_stock_adjustment.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_ticket_type_console.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_card_pool_console.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_reward_policy_console.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin_game_console.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/ticket_booking_flow.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/ticket_cancellation_flow.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/ticket_check_in_flow.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/community_comment_like_actions.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/community_moderation_actions.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/community_trending_tags.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/community_feed_personalization.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/community_post_editing.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/community_comment_moderation.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/search_public_content.sql
          docker exec -i supabase_db_icons-ip psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/catalog_archiving.sql

      - name: Lint local database
        run: supabase db lint --local --fail-on error

  deploy-supabase:
    name: deploy-supabase
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Check Supabase deployment secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is required for Supabase deployment"
              missing=1
            fi
          done
          exit "$missing"

      # Auth URL 설정은 `scripts/sync-supabase-auth.mjs`가 담당한다 — preview 프로젝트도
      # 같은 절차가 필요해서 인라인 bash를 스크립트로 옮겼다.
      #
      # PRUNE: preview는 2026-08-11부터 전용 Supabase 프로젝트를 보므로(ADR-0006) 운영
      # allow-list에 preview wildcard가 남아 있을 이유가 없다. 게다가 이 패턴은 실제
      # preview 호스트(`icons-<hash>-<team>.vercel.app`)와 애초에 맞지도 않았다.
      - name: Sync and verify Supabase Auth configuration
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          SITE_URL: https://iconsip.com
          REQUIRE_SMTP: "true"
          ENFORCE_MAILER: "true"
          REDIRECT_URLS: |
            https://iconsip.com/auth/callback
            https://www.iconsip.com/auth/callback
            https://icons-ip.vercel.app/auth/callback
            http://localhost:3000/auth/callback
            http://127.0.0.1:3000/auth/callback
          PRUNE_REDIRECT_URLS: |
            https://icons-ip-*.vercel.app/auth/callback
        run: node scripts/sync-supabase-auth.mjs

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push Supabase migrations
        run: supabase db push --linked

      - name: Verify Supabase catalog baseline
        run: supabase db query --linked --file supabase/tests/catalog_baseline.sql

  # PR 프리뷰는 전용 Supabase 프로젝트를 본다. 이 job이 먼저 마이그레이션을 올리므로
  # 프리뷰 앱과 스키마의 버전이 어긋나지 않는다 — production의
  # deploy-vercel → deploy-supabase 순서와 같은 모양이다.
  deploy-supabase-preview:
    name: deploy-supabase-preview
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      SUPABASE_PREVIEW_PROJECT_ID: ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
      SUPABASE_PRODUCTION_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check Supabase preview secrets
        id: check
        run: |
          set -eo pipefail

          # 프리뷰가 운영 프로젝트를 가리키면 PR 코드가 운영 데이터에 붙는다.
          # 어드민 콘솔은 프리뷰에서도 Supabase를 강제로 보므로 실제로 도달한다 —
          # 설정 실수를 조용히 통과시키지 않고 여기서 끊는다.
          if [ -n "${SUPABASE_PREVIEW_PROJECT_ID}" ] \
            && [ "${SUPABASE_PREVIEW_PROJECT_ID}" = "${SUPABASE_PRODUCTION_PROJECT_ID}" ]; then
            echo "::error title=Preview Supabase must not be production::SUPABASE_PREVIEW_PROJECT_ID equals SUPABASE_PROJECT_ID"
            exit 1
          fi

          # job env 이름이 아니라 **secret 이름**을 보고한다. `SUPABASE_DB_PASSWORD`는
          # 프리뷰 secret을 담은 job 안의 이름이라, 그대로 안내하면 운영 secret을
          # 덮어쓰게 만든다.
          missing=""
          [ -n "${SUPABASE_ACCESS_TOKEN}" ] || missing="${missing} SUPABASE_ACCESS_TOKEN"
          [ -n "${SUPABASE_DB_PASSWORD}" ] || missing="${missing} SUPABASE_PREVIEW_DB_PASSWORD"
          [ -n "${SUPABASE_PREVIEW_PROJECT_ID}" ] || missing="${missing} SUPABASE_PREVIEW_PROJECT_ID"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Preview deployment skipped::프리뷰 Supabase가 구성되지 않았습니다 (누락:${missing})"
            {
              echo "### 프리뷰 배포를 건너뜀"
              echo
              echo "프리뷰 전용 Supabase 프로젝트가 구성되지 않아 이 PR은 프리뷰 배포가 없습니다."
              echo "구성 전까지 프리뷰로 QA하거나 공유 링크를 만들 수 없습니다 — 깨진 프리뷰보다 없는 프리뷰가 정직합니다."
              echo
              echo "필요한 GitHub Secrets:${missing}. 설정 절차는 README.md의 프리뷰 환경 절을 참고하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        if: steps.check.outputs.configured == 'true'
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # 실제 preview 호스트는 프로젝트 이름(`icons-ip`)이 아니라 배포 접두(`icons-`)를
      # 쓴다: `icons-<hash>-<team>.vercel.app`, `icons-git-<branch>-<team>.vercel.app`.
      # 팀 접미까지 붙여 좁힌다 — `icons-*.vercel.app`은 남의 프로젝트까지 매칭한다.
      #
      # preview에는 custom SMTP가 없어 SMTP 강제와 mailer 설정 강제를 켜지 않는다.
      # 그래서 이메일 확인이 필요한 가입 플로우는 preview에서 끝까지 갈 수 없다.
      - name: Sync Supabase preview Auth URLs
        if: steps.check.outputs.configured == 'true'
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
          SITE_URL: https://icons-ip.vercel.app
          REQUIRE_SMTP: "false"
          ENFORCE_MAILER: "false"
          REDIRECT_URLS: |
            https://icons-ip.vercel.app/auth/callback
            https://icons-hongshil-vn.vercel.app/auth/callback
            https://icons-*-sangwopark19icons-1055s-projects.vercel.app/auth/callback
            https://icons-git-*-sangwopark19icons-1055s-projects.vercel.app/auth/callback
            http://localhost:3000/auth/callback
            http://127.0.0.1:3000/auth/callback
        run: node scripts/sync-supabase-auth.mjs

      - name: Link Supabase preview project
        if: steps.check.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PREVIEW_PROJECT_ID"

      - name: Push Supabase migrations to preview
        if: steps.check.outputs.configured == 'true'
        run: supabase db push --linked

      # 프리뷰 DB에는 운영 데이터를 두지 않는다. 카탈로그 seed는 멱등이라
      # 리뷰어가 매 PR에서 같은 기준선을 본다.
      - name: Seed preview catalog
        if: steps.check.outputs.configured == 'true'
        run: supabase db query --linked --file supabase/seed.sql

      - name: Verify Supabase preview catalog baseline
        if: steps.check.outputs.configured == 'true'
        run: supabase db query --linked --file supabase/tests/catalog_baseline.sql

      # 리뷰어가 이 프리뷰를 어디까지 믿어도 되는지 PR에서 바로 알 수 있어야 한다.
      - name: Report preview database state
        if: steps.check.outputs.configured == 'true'
        run: |
          {
            echo "### 프리뷰 데이터베이스"
            echo
            echo "- 프로젝트: \`${SUPABASE_PREVIEW_PROJECT_ID}\` (운영과 분리된 프리뷰 전용)"
            echo "- 이 PR의 migration이 프리뷰 DB에 적용됐습니다 — 앱과 스키마 버전이 맞습니다."
            echo "- 카탈로그 baseline은 migration에서 오고 \`supabase/seed.sql\`이 mock IP 값을 다시 덮습니다."
            echo "- 어드민으로 새로 만든 레코드는 migration에 없어 프리뷰에 나타나지 않습니다."
            echo "- 프리뷰 DB는 여러 열린 PR이 공유합니다. 실데이터가 없으므로 언제든 리셋할 수 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-vercel-preview:
    name: deploy-vercel-preview
    runs-on: ubuntu-latest
    needs: deploy-supabase-preview
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.deploy-supabase-preview.outputs.configured == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Check Vercel deployment secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is required for Vercel preview deployment"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy Vercel preview
        run: |
          deployment_url="$(vercel deploy --yes --archive=tgz)"
          echo "Preview deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

  deploy-vercel:
    name: deploy-vercel
    runs-on: ubuntu-latest
    needs: deploy-supabase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Check Vercel deployment secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID CRON_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is required for Vercel deployment"
              missing=1
            fi
          done
          if [[ ! "$CRON_SECRET" =~ ^[A-Za-z0-9_-]{16,128}$ ]]; then
            echo "::error title=Invalid GitHub secret::CRON_SECRET must be 16-128 URL-safe characters"
            missing=1
          fi
          exit "$missing"

      - name: Sync Vercel cron secret
        run: |
          vercel link --yes
          printf '%s' "$CRON_SECRET" | vercel env add CRON_SECRET production --sensitive --force --yes

      - name: Deploy Vercel production
        run: |
          deployment_url="$(vercel deploy --yes --prod --archive=tgz)"
          echo "Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
