name: CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      # White Catalog 스테이지 PR(#322, base=통합 브랜치)도 validate와 preview 배포를 받아
      # 스테이지마다 시각 검수가 가능해야 한다. 프로덕션 job은 push+main 조건이라 여기 영향이 없다.
      # S9 일괄 전환 후 통합 브랜치와 함께 제거한다.
      - ps/feat/lfs-storefront-redesign
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      production_redeploy:
        description: Redeploy the current main commit with updated Production configuration
        required: false
        type: boolean
        default: false
      production_source_run_id:
        description: Successful push/main CI/CD Pipeline run ID for this exact commit
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('supabase-preview-pr-{0}', github.event.pull_request.number)
        || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && (github.event.action != 'edited' || github.event.changes.base != null) }}

env:
  NODE_VERSION: "26"
  # 2.101.0 bundles Postgres 17.6.1.106, whose supautils permission-denied
  # path can crash instead of raising 42501 (supabase/postgres#2112).
  SUPABASE_CLI_VERSION: "2.109.1"
  VERCEL_CLI_VERSION: "54.17.2"

jobs:
  # 검증은 재사용 판정(validate-plan) 뒤에 앱 검사(validate-app)와 DB 샤드(validate-db)로
  # 병렬 실행하고, 이름이 그대로인 집계 job(validate)이 모두 통과했을 때만 성공한다.
  # deploy job의 `needs: validate`와 main의 재사용 증거 조회는 집계 job만 본다.
  validate-plan:
    name: validate-plan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      reuse_hit: ${{ steps.reuse.outputs.hit }}

    steps:
      - name: Verify deployed Production source
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.production_redeploy == true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.production_source_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{5,}$ ]]; then
            echo "::error title=Invalid Production source::Provide the successful push/main run ID for this exact commit"
            exit 1
          fi

          run_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          if ! jq -e --arg sha "$GITHUB_SHA" '
            .event == "push"
            and .head_branch == "main"
            and .head_sha == $sha
            and .conclusion == "success"
            and .path == ".github/workflows/pipeline.yml"
          ' <<<"$run_json" >/dev/null; then
            echo "::error title=Unsafe Production source::The run must be a successful push/main deployment for this exact SHA"
            exit 1
          fi

          jobs_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")"
          if ! jq -e '
            any(.jobs[]; .name == "deploy-supabase" and .conclusion == "success")
            and any(.jobs[]; .name == "deploy-vercel" and .conclusion == "success")
          ' <<<"$jobs_json" >/dev/null; then
            echo "::error title=Incomplete Production source::Supabase and Vercel must both have succeeded"
            exit 1
          fi

      - name: Check out repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v6

      # tree에는 이 workflow와 lockfile까지 들어 있으므로, 같은 tree를 통과한 PR·merge queue
      # run은 같은 validate 정의를 같은 입력으로 실행한 증거다. main push는 그 증거가 있으면
      # 검사를 다시 돌리지 않는다. fork PR이 올린 아티팩트는 출처 repo 대조로 거부하고,
      # 조회가 실패하거나 증거가 없으면 전체 검사를 실행한다.
      - name: Reuse validation of the identical tree
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tree="$(git rev-parse 'HEAD^{tree}')"
          api() {
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/$1"
          }
          run_full_validation() {
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Full validation for tree \`$tree\`: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if ! artifacts_json="$(api "actions/artifacts?name=validated-tree-${tree}&per_page=100")"; then
            echo "::warning title=Validation reuse lookup failed::Running full validation"
            run_full_validation "evidence lookup failed"
          fi

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            run_json="$(api "actions/runs/${run_id}")" || continue
            if ! jq -e --arg repo "$GITHUB_REPOSITORY_ID" '
              (.event == "pull_request" or .event == "merge_group")
              and .path == ".github/workflows/pipeline.yml"
              and (.repository.id | tostring) == $repo
              and (.head_repository.id | tostring) == $repo
            ' <<<"$run_json" >/dev/null; then
              continue
            fi
            # 재실행에서 validate가 실패했다면 이전 시도의 아티팩트는 증거로 쓰지 않는다.
            jobs_json="$(api "actions/runs/${run_id}/jobs?filter=latest&per_page=100")" || continue
            if ! jq -e 'any(.jobs[]; .name == "validate" and .conclusion == "success")' \
              <<<"$jobs_json" >/dev/null; then
              continue
            fi

            echo "hit=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Validation reused"
              echo
              echo "- tree: \`$tree\`"
              echo "- evidence: [$(jq -r '.event' <<<"$run_json") run ${run_id}]($(jq -r '.html_url' <<<"$run_json"))"
              echo "- 같은 tree의 lint·typecheck·test·build·DB 검증을 위 run의 \`validate\`가 통과해 다시 실행하지 않았습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done < <(jq -r '.artifacts[] | select(.expired == false) | .workflow_run.id' <<<"$artifacts_json" | sort -u)

          run_full_validation "no same-repository PR or merge queue run validated it"

  validate-app:
    name: validate-app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-plan
    if: needs.validate-plan.outputs.reuse_hit != 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check admin guide changelog
        if: github.event_name == 'pull_request'
        run: node scripts/check-admin-guide-changelog.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build

  # 샤드 목록과 순서는 scripts/database-test-shards.mjs가 소유한다. 샤드마다 새 DB에서 시작하므로
  # 매분 pg_cron sweep과 자동 발주확인 정지도 샤드 DB마다 같은 조건으로 적용된다.
  validate-db:
    name: validate-db (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-plan
    if: needs.validate-plan.outputs.reuse_hit != 'true'
    env:
      # 샤드마다 DB 이미지를 새로 받으므로 ECR 비인증 데이터 한도(Data limit exceeded) 대신
      # Supabase 공식 GHCR 이미지만 쓴다. 이 값이 있으면 CLI는 다른 레지스트리로 넘어가지 않는다.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    strategy:
      fail-fast: false
      matrix:
        shard:
          - operators
          - catalog
          - storefront
          - commerce
          - legacy

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # 일부 DB 회귀는 실제 route·DTO 경계를 node_modules의 vitest로 함께 실행한다.
      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Supabase database
        run: supabase db start

      - name: Apply local migrations
        run: supabase db reset --local --no-seed

      - name: Pause automatic order confirmation in the CI database
        # 매분 cron 틱이 KST 16:30을 걸친 CI 실행에서 다른 스모크가 커밋한 결제완료 주문을 발주확인하지 않게 한다.
        # 꺼진 설정이면 틱은 잠금 없이 끝난다. 자동 발주확인 스모크는 자기 트랜잭션 안에서 설정을 켜고 검증한다.
        run: docker exec -i supabase_db_icons-ip psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -c "update private.auto_order_confirmation_settings set enabled=false, revision=revision+1 where singleton"

      - name: Install database smoke test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep python3
          # Use Supabase's identical GHCR image to avoid ECR anonymous data limits.
          docker pull ghcr.io/supabase/postgrest:v14.14
          # Existing HTTP fixtures inspect this local tag before starting PostgREST.
          docker tag ghcr.io/supabase/postgrest:v14.14 public.ecr.aws/supabase/postgrest:v14.14

      - name: Run database test shard
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/database-test-shards.mjs --shard "$SHARD"

      - name: Lint local database
        run: supabase db lint --local --fail-on error

  validate:
    name: validate
    runs-on: ubuntu-latest
    needs:
      - validate-plan
      - validate-app
      - validate-db
    if: ${{ !cancelled() }}

    steps:
      # 재사용이 적중한 main push만 검사 job을 건너뛸 수 있다. 그 밖에는 앱 검사와 모든 DB 샤드가
      # 성공해야 하며, 건너뛰었거나 실패한 job이 하나라도 있으면 deploy job도 실행되지 않는다.
      - name: Require every validation job
        env:
          PLAN_RESULT: ${{ needs.validate-plan.result }}
          REUSE_HIT: ${{ needs.validate-plan.outputs.reuse_hit }}
          APP_RESULT: ${{ needs.validate-app.result }}
          DB_RESULT: ${{ needs.validate-db.result }}
        run: |
          set -euo pipefail

          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error title=Validation plan failed::validate-plan finished as $PLAN_RESULT"
            exit 1
          fi
          if [ "$REUSE_HIT" = "true" ]; then
            echo "Validation reused; validate-app and validate-db were skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          failed=0
          for job in "validate-app:$APP_RESULT" "validate-db:$DB_RESULT"; do
            if [ "${job#*:}" != "success" ]; then
              echo "::error title=Validation job did not pass::${job%%:*} finished as ${job#*:}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Check out repository
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@v6

      # PR·merge queue가 통과시킨 정확한 merge tree를 남긴다. 같은 tree의 main push는
      # validate-plan의 reuse step이 이 증거를 찾아 검사 job을 건너뛴다. 앱 검사나 DB 샤드가
      # 하나라도 통과하지 못하면 위 step에서 끝나 이 step까지 오지 않는다.
      - name: Record validated tree
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          set -euo pipefail

          tree="$(git rev-parse 'HEAD^{tree}')"
          jq -n \
            --arg tree "$tree" \
            --arg sha "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{tree: $tree, sha: $sha, event: $event, runId: $run_id, runAttempt: $run_attempt}' \
            > "$RUNNER_TEMP/validated-tree.json"
          echo "VALIDATED_TREE=$tree" >> "$GITHUB_ENV"

      - name: Upload validated tree evidence
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/upload-artifact@v7
        with:
          name: validated-tree-${{ env.VALIDATED_TREE }}
          path: ${{ runner.temp }}/validated-tree.json
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  # main 재사용이 적중하면 validate-app·validate-db는 skipped다. job if의 암묵적 success()는
  # 간접 의존 job까지 보므로 skipped 조상 때문에 배포가 조용히 건너뛰어진다. main 배포 사슬은
  # !cancelled()와 직접 의존 job의 결과로만 판정한다.
  deploy-supabase:
    name: deploy-supabase
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      !cancelled()
      && needs.validate.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Check Supabase deployment secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is required for Supabase deployment"
              missing=1
            fi
          done
          exit "$missing"

      # Auth URL 설정은 `scripts/sync-supabase-auth.mjs`가 담당한다 — preview 프로젝트도
      # 같은 절차가 필요해서 인라인 bash를 스크립트로 옮겼다.
      #
      # PRUNE: preview는 2026-08-11부터 전용 Supabase 프로젝트를 보므로(ADR-0006) 운영
      # allow-list에 preview wildcard가 남아 있을 이유가 없다. 게다가 이 패턴은 실제
      # preview 호스트(`icons-<hash>-<team>.vercel.app`)와 애초에 맞지도 않았다.
      #
      # 비밀번호 변경 가드는 앱 handler와 무관하게 recovery 흐름을 유지하므로 앱 배포 전에 켠다.
      # 변경 알림 메일은 custom SMTP가 있는 production에서만 켠다 — preview 계열은 기본 메일
      # 발송 한도를 recovery 메일과 나눠 쓰게 된다.
      - name: Sync and verify Supabase Auth configuration
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          SITE_URL: https://iconsip.com
          REQUIRE_SMTP: "true"
          ENFORCE_MAILER: "true"
          EMAIL_OTP_EXPIRY_SECONDS: "3600"
          PASSWORD_UPDATE_GUARDS: "true"
          PASSWORD_CHANGED_TEMPLATE_PATH: supabase/templates/password_changed_notification.html
          PASSWORD_CHANGED_SUBJECT: ICONS 비밀번호 변경 안내
          REDIRECT_URLS: |
            https://iconsip.com/auth/callback
            https://iconsip.com/auth/recovery/callback
            https://www.iconsip.com/auth/callback
            https://www.iconsip.com/auth/recovery/callback
            https://icons-ip.vercel.app/auth/callback
            https://icons-ip.vercel.app/auth/recovery/callback
            http://localhost:3000/auth/callback
            http://localhost:3000/auth/recovery/callback
            http://127.0.0.1:3000/auth/callback
            http://127.0.0.1:3000/auth/recovery/callback
          PRUNE_REDIRECT_URLS: |
            https://icons-ip-*.vercel.app/auth/callback
        run: node scripts/sync-supabase-auth.mjs

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify payment provider backfill preflight
        run: node scripts/payment-provider-backfill-preflight.mjs --linked

      - name: Push Supabase migrations
        run: supabase db push --linked --include-roles

      - name: Verify payment provider backfill readback
        run: supabase db query --linked --file supabase/tests/payment_provider_production_readback.sql

      - name: Verify Supabase catalog baseline
        run: supabase db query --linked --file supabase/tests/catalog_baseline.sql

      - name: Reconcile production Supabase Edge Functions
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/reconcile-supabase-functions.mjs

  # main 대상 앱 전용 PR만 main과 같은 shared preview DB를 읽기만 한다. Supabase 배포
  # 상태를 바꾸거나 main 외 통합 브랜치를 대상으로 하는 PR은 무데이터 pr-N branch를
  # 매 실행 새로 만들어 정확한 스키마를 적용한다.
  # 어떤 경로도 production 프로젝트를 가리키거나 shared preview에 PR migration을
  # 누적하지 않는다.
  deploy-supabase-preview:
    name: deploy-supabase-preview
    runs-on: ubuntu-latest
    # branch 생성(최대 10분)과 플랫폼 migration run 대기(최대 15분)가 들어간다.
    timeout-minutes: 45
    needs: validate
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'edited' || github.event.changes.base != null)
    permissions:
      actions: read
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      database_mode: ${{ steps.mode.outputs.database_mode }}
      branch_name: ${{ steps.mode.outputs.branch_name }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PREVIEW_PROJECT_ID: ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
      SUPABASE_PRODUCTION_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Supabase preview secrets
        id: check
        run: |
          set -eo pipefail

          # 프리뷰가 운영 프로젝트를 가리키면 PR 코드가 운영 데이터에 붙는다.
          # 어드민 콘솔은 프리뷰에서도 Supabase를 강제로 보므로 실제로 도달한다 —
          # 설정 실수를 조용히 통과시키지 않고 여기서 끊는다.
          if [ -n "${SUPABASE_PREVIEW_PROJECT_ID}" ] \
            && [ "${SUPABASE_PREVIEW_PROJECT_ID}" = "${SUPABASE_PRODUCTION_PROJECT_ID}" ]; then
            echo "::error title=Preview Supabase must not be production::SUPABASE_PREVIEW_PROJECT_ID equals SUPABASE_PROJECT_ID"
            exit 1
          fi

          missing=""
          [ -n "${SUPABASE_ACCESS_TOKEN}" ] || missing="${missing} SUPABASE_ACCESS_TOKEN"
          [ -n "${SUPABASE_PREVIEW_PROJECT_ID}" ] || missing="${missing} SUPABASE_PREVIEW_PROJECT_ID"
          [ -n "${SUPABASE_PRODUCTION_PROJECT_ID}" ] || missing="${missing} SUPABASE_PROJECT_ID"

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Preview deployment skipped::프리뷰 Supabase가 구성되지 않았습니다 (누락:${missing})"
            {
              echo "### 프리뷰 배포를 건너뜀"
              echo
              echo "프리뷰 전용 Supabase 프로젝트가 구성되지 않아 이 PR은 프리뷰 배포가 없습니다."
              echo "구성 전까지 프리뷰로 QA하거나 공유 링크를 만들 수 없습니다 — 깨진 프리뷰보다 없는 프리뷰가 정직합니다."
              echo
              echo "필요한 GitHub Secrets:${missing}. 설정 절차는 README.md의 프리뷰 환경 절을 참고하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Select preview database mode
        id: mode
        if: steps.check.outputs.configured == 'true'
        run: |
          set -euo pipefail

          changed_paths_file="$(mktemp)"
          trap 'rm -f "$changed_paths_file"' EXIT
          git diff --name-only --no-renames --diff-filter=ACDMRT -z \
            "$PR_BASE_SHA...$PR_HEAD_SHA" > "$changed_paths_file"

          database_mode="$(
            node scripts/preview-supabase-mode.mjs --base-ref "$PR_BASE_REF" < "$changed_paths_file"
          )"
          if [ "$database_mode" = "isolated" ]; then
            branch_name="pr-${PR_NUMBER}"
          else
            branch_name="main"
          fi

          echo "database_mode=$database_mode" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"

      # Supabase branch는 shared preview의 현재 main에서 파생된다. 오래된 PR head를
      # 그대로 적용하면 최신 main migration이 섞인 superset이 되므로, isolated
      # Preview는 현재 main을 포함하는 head에서만 만든다.
      - name: Verify isolated preview contains current main
        if: steps.check.outputs.configured == 'true' && steps.mode.outputs.database_mode == 'isolated'
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          current_main_sha="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$current_main_sha" "$PR_HEAD_SHA"; then
            echo "::error title=Isolated preview head is behind main::Merge current main ($current_main_sha) into this PR before deploying its database branch"
            exit 1
          fi
          echo "Isolated preview head contains current main: $current_main_sha" >> "$GITHUB_STEP_SUMMARY"

      # shared main이 PR base보다 뒤처졌다면 앱 전용 변경도 새 base schema와 맞지 않는다.
      # base workflow에 sync job이 도입된 뒤부터 exact SHA의 성공 증거를 필수로 한다.
      - name: Verify shared preview base synchronization
        if: steps.check.outputs.configured == 'true' && steps.mode.outputs.database_mode == 'shared'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          base_workflow="$(git show "$PR_BASE_SHA:.github/workflows/pipeline.yml")"
          if ! grep -q '^  sync-supabase-preview-main:' <<<"$base_workflow"; then
            if ! grep -q '^  sync-supabase-preview-main:' .github/workflows/pipeline.yml; then
              echo "::error title=Shared preview sync contract is missing::The base and PR head both lack sync-supabase-preview-main"
              exit 1
            fi
            {
              echo "### Shared preview base 확인"
              echo
              echo "- bootstrap: 이 PR이 base에 없던 shared sync job을 처음 도입합니다."
              echo "- 이 PR이 main에 반영된 다음 base SHA부터 성공한 sync 증거를 강제합니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 증거는 두 job의 결론이다. 뒤따르는 deploy-staging까지 run 전체가 끝나기를
          # 기다리지 않도록 실행 중인 run도 조회하고, 진행 중인 job은 success가 아니라 거부된다.
          runs_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline.yml/runs?event=push&head_sha=${PR_BASE_SHA}&per_page=20")"

          synchronized_run_id=""
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            jobs_json="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
            if jq -e '
              any(.jobs[]; .name == "deploy-supabase" and .conclusion == "success")
              and any(.jobs[]; .name == "sync-supabase-preview-main" and .conclusion == "success")
            ' <<<"$jobs_json" >/dev/null; then
              synchronized_run_id="$run_id"
              break
            fi
          done < <(jq -r --arg sha "$PR_BASE_SHA" '
            .workflow_runs[]
            | select(
                .event == "push"
                and .head_branch == "main"
                and .head_sha == $sha
                and .path == ".github/workflows/pipeline.yml"
              )
            | .id
          ' <<<"$runs_json")

          if [ -z "$synchronized_run_id" ]; then
            echo "::error title=Shared preview is behind or unverified::Wait for or rerun the push/main sync for base $PR_BASE_SHA"
            exit 1
          fi
          echo "Shared preview sync evidence: run $synchronized_run_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Supabase CLI
        if: steps.check.outputs.configured == 'true'
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # PR migration은 수정·삭제될 수 있어 기존 branch를 재사용하면 같은 version의
      # 과거 SQL이 남는다. 무데이터 branch를 매 실행 재생성해 PR head와 정확히 맞춘다.
      # app-only로 되돌아온 PR에 stale pr-N이 남아 있으면 여기서 함께 정리한다.
      - name: Prepare exact Supabase preview branch
        if: steps.check.outputs.configured == 'true'
        env:
          DATABASE_MODE: ${{ steps.mode.outputs.database_mode }}
        run: |
          set -euo pipefail

          branch_name="pr-${PR_NUMBER}"
          list_branches() {
            supabase branches list \
              --project-ref "$SUPABASE_PREVIEW_PROJECT_ID" \
              --output json
          }
          branch_exists() {
            list_branches | jq -e --arg name "$branch_name" \
              'any(.[]; .name == $name and .is_default == false)' >/dev/null
          }
          wait_until_deleted() {
            for _ in {1..60}; do
              if ! branch_exists; then
                return 0
              fi
              sleep 5
            done
            echo "::error title=Supabase branch cleanup timed out::$branch_name was not deleted"
            return 1
          }

          if branch_exists; then
            supabase branches delete "$branch_name" \
              --project-ref "$SUPABASE_PREVIEW_PROJECT_ID" \
              --yes
            wait_until_deleted
          fi

          if [ "$DATABASE_MODE" = "shared" ]; then
            {
              echo "### 프리뷰 데이터베이스"
              echo
              echo "- 모드: shared main (읽기 전용 사용)"
              echo "- Supabase 배포 변경이 없어 PR DB mutation을 수행하지 않았습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          supabase branches create "$branch_name" \
            --project-ref "$SUPABASE_PREVIEW_PROJECT_ID" \
            --region ap-northeast-2 \
            --size micro \
            --yes \
            --output json >/dev/null

          branch_json=""
          for _ in {1..60}; do
            branch_json="$(
              list_branches | jq -c --arg name "$branch_name" \
                '.[] | select(.name == $name and .is_default == false)'
            )"
            status="$(jq -r '.preview_project_status // empty' <<<"$branch_json")"
            if [ "$status" = "ACTIVE_HEALTHY" ]; then
              break
            fi
            if [[ "$status" =~ (FAILED|ERROR) ]]; then
              echo "::error title=Supabase branch creation failed::$branch_name status is $status"
              exit 1
            fi
            sleep 10
          done

          status="$(jq -r '.preview_project_status // empty' <<<"$branch_json")"
          branch_project_ref="$(jq -r '.project_ref // empty' <<<"$branch_json")"
          if [ "$status" != "ACTIVE_HEALTHY" ] || [ -z "$branch_project_ref" ]; then
            echo "::error title=Supabase branch creation timed out::$branch_name did not become healthy"
            exit 1
          fi
          if [ "$branch_project_ref" = "$SUPABASE_PREVIEW_PROJECT_ID" ] \
            || [ "$branch_project_ref" = "$SUPABASE_PRODUCTION_PROJECT_ID" ]; then
            echo "::error title=Unsafe Supabase branch::Expected a new preview project ref"
            exit 1
          fi

          # git 없이 만든 branch는 ACTIVE_HEALTHY 뒤에도 플랫폼 run이 parent 이력을 migration으로
          # 다시 적용한다. 그 run과 db push가 같은 migration을 동시에 적용하지 않도록, run이
          # 끝난 뒤에만 Auth 동기화와 db push로 넘어간다.
          BRANCH_NAME="$branch_name" \
            BRANCH_ID="$(jq -r '.id // empty' <<<"$branch_json")" \
            PROJECT_REF="$branch_project_ref" \
            node scripts/wait-supabase-branch-deployment.mjs

          # Parent snapshot은 branch 생성이 아니라 플랫폼 pull이 parent 이력을 읽을 때 정해진다.
          # 그 run이 끝난 뒤 main을 다시 읽어, 최초 ancestry 검사 뒤 push/main sync가 parent를
          # 전진시켰다면 fail closed한다.
          git fetch --no-tags origin main
          latest_main_sha="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$latest_main_sha" "$PR_HEAD_SHA"; then
            echo "::error title=Main advanced during isolated preview creation::Merge current main ($latest_main_sha) into this PR and rerun the workflow"
            supabase branches delete "$branch_name" \
              --project-ref "$SUPABASE_PREVIEW_PROJECT_ID" \
              --yes
            wait_until_deleted
            exit 1
          fi

          credentials="$(
            supabase branches get "$branch_name" \
              --project-ref "$SUPABASE_PREVIEW_PROJECT_ID" \
              --output json
          )"
          for name in POSTGRES_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            value="$(jq -r --arg name "$name" '.[$name] // empty' <<<"$credentials")"
            if [ -z "$value" ]; then
              echo "::error title=Missing Supabase branch credential::$name is unavailable"
              exit 1
            fi
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          public_key="$(
            jq -r '.SUPABASE_PUBLISHABLE_KEY // .SUPABASE_ANON_KEY // empty' \
              <<<"$credentials"
          )"
          if [ -z "$public_key" ]; then
            echo "::error title=Missing Supabase branch credential::No publishable or anon key is available"
            exit 1
          fi
          echo "::add-mask::$public_key"
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$public_key" >> "$GITHUB_ENV"
          printf 'PROJECT_REF=%s\n' "$branch_project_ref" >> "$GITHUB_ENV"

      # 실제 preview 호스트는 프로젝트 이름(`icons-ip`)이 아니라 배포 접두(`icons-`)를
      # 쓴다. preview branch에는 custom SMTP가 없으므로 URL과 TTL만 동기화한다.
      - name: Sync isolated Supabase preview Auth URLs
        if: steps.check.outputs.configured == 'true' && steps.mode.outputs.database_mode == 'isolated'
        env:
          SITE_URL: https://icons-ip.vercel.app
          REQUIRE_SMTP: "false"
          ENFORCE_MAILER: "false"
          EMAIL_OTP_EXPIRY_SECONDS: "3600"
          PASSWORD_UPDATE_GUARDS: "true"
          REDIRECT_URLS: |
            https://icons-ip.vercel.app/auth/callback
            https://icons-ip.vercel.app/auth/recovery/callback
            https://icons-hongshil-vn.vercel.app/auth/callback
            https://icons-hongshil-vn.vercel.app/auth/recovery/callback
            https://icons-*-sangwopark19icons-1055s-projects.vercel.app/auth/callback
            https://icons-*-sangwopark19icons-1055s-projects.vercel.app/auth/recovery/callback
            https://icons-git-*-sangwopark19icons-1055s-projects.vercel.app/auth/callback
            https://icons-git-*-sangwopark19icons-1055s-projects.vercel.app/auth/recovery/callback
            http://localhost:3000/auth/callback
            http://localhost:3000/auth/recovery/callback
            http://127.0.0.1:3000/auth/callback
            http://127.0.0.1:3000/auth/recovery/callback
        run: node scripts/sync-supabase-auth.mjs

      # 플랫폼이 기록한 이력 다음부터 push한다. production `db push --linked`처럼 --include-all
      # 없이 실행하므로 기록된 최신 이력보다 이른 PR migration은 여기서도 거부된다.
      - name: Apply migrations and seed to isolated preview
        if: steps.check.outputs.configured == 'true' && steps.mode.outputs.database_mode == 'isolated'
        run: |
          set -euo pipefail

          recorded_versions() {
            docker run --rm -i postgres:17-alpine \
              psql "$POSTGRES_URL" -X -A -t -q -v ON_ERROR_STOP=1 <<'SQL'
          select to_regclass('supabase_migrations.schema_migrations') is not null as has_history \gset
          \if :has_history
          select version from supabase_migrations.schema_migrations order by version;
          \endif
          SQL
          }

          before="$(mktemp)"
          after="$(mktemp)"
          push_log="$(mktemp)"
          trap 'rm -f "$before" "$after" "$push_log"' EXIT

          recorded_versions > "$before"
          recorded_count="$(wc -l < "$before" | tr -d ' ')"
          recorded_latest="$(tail -n 1 "$before")"
          echo "Migration history before db push: ${recorded_count} version(s), latest ${recorded_latest:-none}"

          set +e
          supabase db push --db-url "$POSTGRES_URL" --include-roles --include-seed --yes 2>&1 \
            | tee "$push_log"
          push_status="${PIPESTATUS[0]}"
          set -e
          if [ "$push_status" -ne 0 ]; then
            if grep -q 'inserted before the last migration' "$push_log"; then
              echo "::error title=PR migration predates recorded main history::Rename it after ${recorded_latest}; production db push rejects it the same way, so do not add --include-all"
            fi
            exit "$push_status"
          fi

          recorded_versions > "$after"
          pushed_versions="$(LC_ALL=C comm -13 "$before" "$after")"
          pushed_count="$(grep -c . <<<"$pushed_versions" || true)"
          echo "::group::Migrations applied by this db push (${pushed_count})"
          {
            echo "### Isolated preview migration 적용"
            echo
            echo "- push 전 기록된 이력: ${recorded_count}개 (마지막 \`${recorded_latest:-없음}\`)"
            echo "- 이 단계의 \`db push\`가 적용: ${pushed_count}개"
            echo
            echo "<details><summary>적용 목록</summary>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for version in $pushed_versions; do
            for file in supabase/migrations/"${version}"_*.sql; do
              echo "${file##*/}"
              echo "- \`${file##*/}\`" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          printf '\n</details>\n' >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"

      - name: Reconcile Edge Functions in isolated preview
        if: steps.check.outputs.configured == 'true' && steps.mode.outputs.database_mode == 'isolated'
        run: node scripts/reconcile-supabase-functions.mjs

      - name: Verify isolated preview catalog baseline
        if: steps.check.outputs.configured == 'true' && steps.mode.outputs.database_mode == 'isolated'
        run: |
          docker run --rm -i postgres:17-alpine \
            psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 \
            < supabase/tests/catalog_baseline.sql

      # 리뷰어가 이 프리뷰를 어디까지 믿어도 되는지 PR에서 바로 알 수 있어야 한다.
      - name: Report preview database state
        if: steps.check.outputs.configured == 'true' && steps.mode.outputs.database_mode == 'isolated'
        run: |
          {
            echo "### 프리뷰 데이터베이스"
            echo
            echo "- 모드: isolated \`pr-${PR_NUMBER}\`"
            echo "- 프로젝트: \`${PROJECT_REF}\` (운영·shared preview와 분리, 운영 데이터 복제 없음)"
            echo "- 플랫폼이 parent(shared main) migration 이력을 먼저 적용했고, 그 run이 끝난 뒤 이 PR head의 나머지 migration과 roles, seed, repo Edge Functions를 새 branch에 적용했습니다."
            echo "- 새 커밋에서는 branch를 재생성하고 PR close 때 삭제합니다."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-vercel-preview:
    name: deploy-vercel-preview
    runs-on: ubuntu-latest
    needs: deploy-supabase-preview
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.deploy-supabase-preview.outputs.configured == 'true'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PREVIEW_PROJECT_ID: ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
      SUPABASE_PRODUCTION_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      DATABASE_MODE: ${{ needs.deploy-supabase-preview.outputs.database_mode }}
      BRANCH_NAME: ${{ needs.deploy-supabase-preview.outputs.branch_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Check Vercel deployment secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PREVIEW_PROJECT_ID SUPABASE_PRODUCTION_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is required for Vercel preview deployment"
              missing=1
            fi
          done
          if [ -n "$SUPABASE_PREVIEW_PROJECT_ID" ] \
            && [ "$SUPABASE_PREVIEW_PROJECT_ID" = "$SUPABASE_PRODUCTION_PROJECT_ID" ]; then
            echo "::error title=Preview Supabase must not be production::Preview and production refs are equal"
            missing=1
          fi
          exit "$missing"

      - name: Verify Vercel preview upload manifest
        run: |
          set -euo pipefail

          manifest="$(vercel deploy --dry --format=json)"
          total_size="$(jq -r '.totalSize // 0' <<<"$manifest")"
          file_count="$(jq -r '.fileCount // 0' <<<"$manifest")"

          if jq -e 'any(.files[]?; .path == "outputs" or (.path | startswith("outputs/")))' \
            <<<"$manifest" >/dev/null; then
            echo "::error title=Local outputs entered Vercel upload::Check .vercelignore before deploying"
            exit 1
          fi
          if [ "$total_size" -ge 900000000 ]; then
            echo "::error title=Vercel preview upload is too large::$total_size bytes exceeds the 900 MB safety cap"
            exit 1
          fi
          if [ "$file_count" -ge 15000 ]; then
            echo "::error title=Too many Vercel source files::$file_count files reaches the platform limit"
            exit 1
          fi

          {
            echo "### Vercel upload manifest"
            echo
            echo "- source bytes: $total_size"
            echo "- source files: $file_count"
            echo "- \`outputs/\`: excluded"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Load exact Supabase credentials for deployment
        run: |
          set -euo pipefail

          if [ "$DATABASE_MODE" = "isolated" ]; then
            expected_branch="pr-${{ github.event.pull_request.number }}"
            if [ "$BRANCH_NAME" != "$expected_branch" ]; then
              echo "::error title=Invalid Supabase preview branch::$BRANCH_NAME does not match $expected_branch"
              exit 1
            fi
          elif [ "$DATABASE_MODE" = "shared" ] && [ "$BRANCH_NAME" = "main" ]; then
            expected_branch="main"
          else
            echo "::error title=Invalid Supabase preview mode::$DATABASE_MODE / $BRANCH_NAME"
            exit 1
          fi

          branch_json="$(
            supabase branches list \
              --project-ref "$SUPABASE_PREVIEW_PROJECT_ID" \
              --output json \
              | jq -c --arg name "$expected_branch" '.[] | select(.name == $name)'
          )"
          branch_project_ref="$(jq -r '.project_ref // empty' <<<"$branch_json")"
          if [ -z "$branch_project_ref" ] \
            || [ "$branch_project_ref" = "$SUPABASE_PRODUCTION_PROJECT_ID" ]; then
            echo "::error title=Unsafe Supabase deployment target::Preview branch ref is missing or production"
            exit 1
          fi
          if [ "$DATABASE_MODE" = "shared" ] \
            && [ "$branch_project_ref" != "$SUPABASE_PREVIEW_PROJECT_ID" ]; then
            echo "::error title=Unsafe shared preview target::main did not resolve to icons-ip-preview"
            exit 1
          fi

          credentials="$(
            supabase branches get "$expected_branch" \
              --project-ref "$SUPABASE_PREVIEW_PROJECT_ID" \
              --output json
          )"
          resolved_supabase_url=""
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            value="$(jq -r --arg name "$name" '.[$name] // empty' <<<"$credentials")"
            if [ -z "$value" ]; then
              echo "::error title=Missing Supabase deployment credential::$name is unavailable"
              exit 1
            fi
            if [ "$name" = "SUPABASE_URL" ]; then
              resolved_supabase_url="$value"
            fi
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
          public_key="$(
            jq -r '.SUPABASE_PUBLISHABLE_KEY // .SUPABASE_ANON_KEY // empty' \
              <<<"$credentials"
          )"
          if [ -z "$public_key" ]; then
            echo "::error title=Missing Supabase deployment credential::No publishable or anon key is available"
            exit 1
          fi
          echo "::add-mask::$public_key"
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$public_key" >> "$GITHUB_ENV"
          printf 'PROJECT_REF=%s\n' "$branch_project_ref" >> "$GITHUB_ENV"

          if [ "$resolved_supabase_url" = "https://${SUPABASE_PRODUCTION_PROJECT_ID}.supabase.co" ]; then
            echo "::error title=Preview resolved to production::Refusing Vercel deployment"
            exit 1
          fi

      # shared main은 mutable하므로 evidence 확인 뒤 main이 전진했다면 오래된 앱을
      # 더 최신 DB 상태에 배포하지 않는다. base가 갱신된 새 PR run에서 다시 배포한다.
      - name: Revalidate shared preview main before deployment
        if: env.DATABASE_MODE == 'shared'
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          current_main_sha="$(git rev-parse origin/main)"
          if [ "$PR_BASE_SHA" != "$current_main_sha" ]; then
            echo "::error title=Shared preview base advanced::PR base $PR_BASE_SHA is not current main $current_main_sha"
            exit 1
          fi
          echo "Shared preview deployment still matches current main: $current_main_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Vercel preview
        run: |
          deployment_url="$(
            vercel deploy --yes --archive=tgz \
              --build-env "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" \
              --build-env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
              --build-env "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" \
              --build-env "ICONS_CATALOG_SOURCE=supabase" \
              --env "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" \
              --env "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
              --env "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" \
              --env "ICONS_CATALOG_SOURCE=supabase"
          )"
          echo "Preview deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Database mode: $DATABASE_MODE ($BRANCH_NAME)" >> "$GITHUB_STEP_SUMMARY"

      # Preview handler가 먼저 배포된 뒤에만 이 PR의 recovery link 형식을 활성화한다.
      - name: Activate recovery template in isolated preview
        if: env.DATABASE_MODE == 'isolated'
        env:
          SITE_URL: https://icons-ip.vercel.app
          REQUIRE_SMTP: "false"
          ENFORCE_MAILER: "false"
          RECOVERY_TEMPLATE_PATH: supabase/templates/recovery.html
        run: node scripts/sync-supabase-auth.mjs

  # shared preview의 main branch는 production Supabase와 앱 배포가 모두 성공한 정확한
  # main만 따라간다. PR workflow는 이 프로젝트를 절대로 link/push/seed하지 않는다.
  sync-supabase-preview-main:
    name: sync-supabase-preview-main
    runs-on: ubuntu-latest
    needs:
      - deploy-supabase
      - deploy-vercel
    if: >-
      !cancelled()
      && needs.deploy-supabase.result == 'success'
      && needs.deploy-vercel.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      SUPABASE_PREVIEW_PROJECT_ID: ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
      SUPABASE_PRODUCTION_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PROJECT_REF: ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Check shared preview sync secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PREVIEW_PROJECT_ID SUPABASE_PRODUCTION_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is required for shared preview sync"
              missing=1
            fi
          done
          if [ -n "$SUPABASE_PREVIEW_PROJECT_ID" ] \
            && [ "$SUPABASE_PREVIEW_PROJECT_ID" = "$SUPABASE_PRODUCTION_PROJECT_ID" ]; then
            echo "::error title=Preview Supabase must not be production::Refusing shared preview sync"
            missing=1
          fi
          exit "$missing"

      # 과거 main run을 재실행해 이미 더 최신 상태인 shared preview를 되돌리지 않는다.
      # main push run은 같은 concurrency group에서 직렬화되므로, 이 시점 이후 main이
      # 전진하면 현재 run이 먼저 끝난 뒤 최신 run이 최종 상태를 적용한다.
      - name: Verify this run is still current main
        run: |
          git fetch --no-tags origin main
          current_main_sha="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$current_main_sha" ]; then
            echo "::error title=Outdated shared preview sync::Run SHA $GITHUB_SHA is not current main $current_main_sha"
            exit 1
          fi
          echo "Shared preview sync source is current main: $current_main_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync shared preview Auth URLs
        env:
          SITE_URL: https://icons-ip.vercel.app
          REQUIRE_SMTP: "false"
          ENFORCE_MAILER: "false"
          EMAIL_OTP_EXPIRY_SECONDS: "3600"
          PASSWORD_UPDATE_GUARDS: "true"
          RECOVERY_TEMPLATE_PATH: supabase/templates/recovery.html
          REDIRECT_URLS: |
            https://icons-ip.vercel.app/auth/callback
            https://icons-ip.vercel.app/auth/recovery/callback
            https://icons-hongshil-vn.vercel.app/auth/callback
            https://icons-hongshil-vn.vercel.app/auth/recovery/callback
            https://icons-*-sangwopark19icons-1055s-projects.vercel.app/auth/callback
            https://icons-*-sangwopark19icons-1055s-projects.vercel.app/auth/recovery/callback
            https://icons-git-*-sangwopark19icons-1055s-projects.vercel.app/auth/callback
            https://icons-git-*-sangwopark19icons-1055s-projects.vercel.app/auth/recovery/callback
            http://localhost:3000/auth/callback
            http://localhost:3000/auth/recovery/callback
            http://127.0.0.1:3000/auth/callback
            http://127.0.0.1:3000/auth/recovery/callback
        run: node scripts/sync-supabase-auth.mjs

      - name: Link shared preview main
        run: supabase link --project-ref "$SUPABASE_PREVIEW_PROJECT_ID"

      - name: Apply main migrations and seed to shared preview
        run: supabase db push --linked --include-roles --include-seed --yes

      - name: Reconcile shared preview Supabase Edge Functions
        run: node scripts/reconcile-supabase-functions.mjs

      - name: Verify shared preview catalog baseline
        run: supabase db query --linked --file supabase/tests/catalog_baseline.sql

      - name: Report shared preview sync
        run: |
          {
            echo "### Shared preview main 동기화"
            echo
            echo "- production 앱·Supabase 배포 성공 후 동일한 main migration, roles, seed, Auth template과 Edge Functions를 적용했습니다."
            echo "- PR migration은 이 프로젝트에 적용하지 않습니다."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: sync-supabase-preview-main
    if: >-
      !cancelled()
      && needs.sync-supabase-preview-main.result == 'success'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PREVIEW_PROJECT_ID: ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
      SUPABASE_PRODUCTION_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGING_ALIAS: ${{ vars.STAGING_ALIAS || 'icons-ip-staging.vercel.app' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Check staging configuration and current main
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PREVIEW_PROJECT_ID SUPABASE_PRODUCTION_PROJECT_ID VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing staging configuration::$name is required; see docs/runbooks/staging.md"
              exit 1
            fi
          done
          git fetch --no-tags origin main
          if [ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]; then
            echo "::error title=Outdated staging deployment::Run source must equal current main"
            exit 1
          fi
      - name: Resolve persistent staging Supabase branch
        run: node scripts/staging-environment.mjs
      - name: Validate staging deployment environment
        run: node --input-type=module -e "import { stagingDeploymentEnvironment } from './scripts/staging-environment.mjs'; stagingDeploymentEnvironment(process.env)"
      - name: Apply staging migrations without resetting rehearsal data
        run: supabase db push --db-url "$POSTGRES_URL" --include-roles --yes
      - name: Add missing synthetic staging fixtures
        run: |
          docker run --rm -i postgres:17-alpine \
            psql "$POSTGRES_URL" -X --single-transaction -v ON_ERROR_STOP=1 \
            -c "SET LOCAL app.staging_seed_enabled = 'admin-ops-v1'" -f - \
            < supabase/seeds/admin-ops-staging.sql
      - name: Reconcile staging Supabase Edge Functions
        run: node scripts/reconcile-supabase-functions.mjs
      - name: Sync staging Auth URLs
        env:
          REQUIRE_SMTP: "false"
          ENFORCE_MAILER: "false"
          EMAIL_OTP_EXPIRY_SECONDS: "3600"
          PASSWORD_UPDATE_GUARDS: "true"
        run: |
          export SITE_URL="https://$STAGING_ALIAS"
          export REDIRECT_URLS="https://$STAGING_ALIAS/auth/callback
          https://$STAGING_ALIAS/auth/recovery/callback"
          node scripts/sync-supabase-auth.mjs
      - name: Deploy and alias staging Preview
        # Remote prebuild validates the inherited sensitive Preview Toss keys before alias activation.
        run: node scripts/deploy-staging.mjs
      - name: Activate staging recovery template
        env:
          REQUIRE_SMTP: "false"
          ENFORCE_MAILER: "false"
          RECOVERY_TEMPLATE_PATH: supabase/templates/recovery.html
        run: |
          export SITE_URL="https://$STAGING_ALIAS"
          node scripts/sync-supabase-auth.mjs

  deploy-vercel:
    name: deploy-vercel
    runs-on: ubuntu-latest
    needs:
      - validate
      - deploy-supabase
    # push는 기존 DB→앱 순서를 유지한다. config-only 수동 재배포는 validate가
    # 성공하고 main에서 명시적으로 승인된 경우에만, 건너뛴 DB job을 우회한다.
    if: >-
      !cancelled()
      && needs.validate.result == 'success'
      && (
        (
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && needs.deploy-supabase.result == 'success'
        )
        || (
          github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main'
          && inputs.production_redeploy == true
          && needs.deploy-supabase.result == 'skipped'
        )
      )
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Check Vercel deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID CRON_SECRET SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is required for Vercel deployment"
              missing=1
            fi
          done
          if [[ ! "$CRON_SECRET" =~ ^[A-Za-z0-9_-]{16,128}$ ]]; then
            echo "::error title=Invalid GitHub secret::CRON_SECRET must be 16-128 URL-safe characters"
            missing=1
          fi
          exit "$missing"

      - name: Sync Vercel cron secret
        run: |
          vercel link --yes
          printf '%s' "$CRON_SECRET" | vercel env add CRON_SECRET production --sensitive --force --yes

      - name: Deploy Vercel production
        run: |
          deployment_url="$(vercel deploy --yes --prod --archive=tgz)"
          echo "Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      # handler와 기존 PKCE 호환 경로가 production에 먼저 올라간 뒤에만 새 링크를 발급한다.
      - name: Activate recovery token-hash template in production
        # config-only 재배포는 Supabase 원격 설정도 변경하지 않는다.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
          SITE_URL: https://iconsip.com
          REQUIRE_SMTP: "true"
          ENFORCE_MAILER: "true"
          RECOVERY_TEMPLATE_PATH: supabase/templates/recovery.html
        run: node scripts/sync-supabase-auth.mjs
