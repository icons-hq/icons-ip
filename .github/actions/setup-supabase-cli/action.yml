name: Set up Supabase CLI
description: >-
  Linux X64 러너에 고정 버전 Supabase CLI release tarball을 받아 SHA-256을 대조한 뒤 PATH에 올린다.
  다운로드는 요청마다 상한을 두고, 끊기거나 정체되면 정해진 시간 안에서 다시 받는다.

# supabase/setup-cli@v2를 대체한다. 그 action은 Bun 1.3.10 위에서 @actions/tool-cache로
# tarball을 받는데, Bun 1.3.10의 node:http는 응답 헤더 뒤 본문이 멈추면 req.setTimeout이
# 발화하지 않아 @actions/http-client의 유일한 정체 방어가 동작하지 않는다. 그래서 끊긴 다운로드가
# 출력 없이 무한 대기했다(run 41991138701, 21,607초). 이 action은 curl의 요청별 상한·정체 감지·
# 재시도로 같은 정체를 수십 초 안에 다시 받고, 공개 release asset을 고정 SHA-256으로 확인한다.
# 버전을 올릴 때는 release의 checksums.txt에서 같은 tarball의 SHA-256을 함께 바꾼다.

inputs:
  version:
    description: Supabase CLI release version without the leading v, for example 2.109.1.
    required: true
  sha256:
    description: SHA-256 of supabase_<version>_linux_amd64.tar.gz from the release checksums.txt.
    required: true

outputs:
  version:
    description: Version reported by the installed supabase --version.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      name: Download, verify and install Supabase CLI
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.version }}
        CLI_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail

        if [ "${RUNNER_OS}" != "Linux" ] || [ "${RUNNER_ARCH}" != "X64" ]; then
          echo "::error title=Unsupported runner::Supabase CLI installer supports Linux X64 only, got ${RUNNER_OS} ${RUNNER_ARCH}"
          exit 1
        fi
        if [[ ! "$CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error title=Invalid Supabase CLI version::Use a release version like 2.109.1"
          exit 1
        fi
        if [[ ! "$CLI_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error title=Invalid Supabase CLI checksum::Use the lowercase SHA-256 from checksums.txt"
          exit 1
        fi

        asset="supabase_${CLI_VERSION}_linux_amd64.tar.gz"
        archive="${RUNNER_TEMP}/${asset}"
        install_dir="${RUNNER_TEMP}/supabase-cli-${CLI_VERSION}"
        rm -rf "$install_dir" "$archive"
        mkdir -p "$install_dir"

        # 요청 하나는 60초 안에 끝나야 하고, 20초 동안 100 KiB/s 미만이면 정체로 보고 끊는다.
        # 실패하거나 끊긴 요청은 처음 시작부터 180초 안에서 다시 받는다(최악 약 240초 < step 상한 5분).
        # 재시도는 출력 파일을 비우고 처음부터 받으며, 결과는 아래 SHA-256 대조가 다시 확인한다.
        curl --fail --silent --show-error --location \
          --proto '=https' --proto-redir '=https' --tlsv1.2 \
          --connect-timeout 10 \
          --speed-limit 102400 --speed-time 20 \
          --max-time 60 \
          --retry 3 --retry-delay 3 --retry-all-errors --retry-max-time 180 \
          --output "$archive" \
          "https://github.com/supabase/cli/releases/download/v${CLI_VERSION}/${asset}"

        digest="$(sha256sum "$archive")"
        digest="${digest%% *}"
        if [ "$digest" != "$CLI_SHA256" ]; then
          rm -f "$archive"
          echo "::error title=Supabase CLI checksum mismatch::${asset} is ${digest}, expected the pinned ${CLI_SHA256}"
          exit 1
        fi

        # tarball에는 supabase와 함께 쓰는 supabase-go가 같이 들어 있다.
        tar -xzf "$archive" -C "$install_dir"
        rm -f "$archive"

        installed="$("$install_dir/supabase" --version)"
        if [ "$installed" != "$CLI_VERSION" ]; then
          echo "::error title=Unexpected Supabase CLI version::Installed ${installed}, expected ${CLI_VERSION}"
          exit 1
        fi

        echo "$install_dir" >> "$GITHUB_PATH"
        echo "version=${installed}" >> "$GITHUB_OUTPUT"
        echo "Installed Supabase CLI ${installed} (${asset}, SHA-256 verified)"
